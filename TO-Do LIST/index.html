<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container"> 
        <div class="todo-app">
            <h2>To-Do List <img src="favicon.ico" alt="Logo"></h2>
            <div class="row">
                <input type="text" id="input-box" placeholder="Add a new task..." aria-label="New task">
                <button onclick="AddTask()" id="add-task-btn">Add Task</button>
            </div>
            <ul id="list-container" aria-live="polite"></ul>
        </div>
     </div>
     <script src="script.js"></script>
</body>
</html>
